# ---------------------------------------------------------------------------
# Game Engine Core
# ---------------------------------------------------------------------------

class GameEngine:
    """
    Core game engine for Star Wars: Rebellion.
    
    Manages game state, validates actions, and coordinates game flow.
    """

    def __init__(self, game_id: Optional[str] = None) -> None:
        """
        Initialize game engine.
        
        Args:
            game_id: Optional game identifier
        """
        self.game_id = game_id or str(uuid4())
        self.state: Dict[str, Any] = {}
        self.phase: Phase = Phase.COMMAND
        self.github_client = GitHubAPIClient()
        self.rate_limiter = RateLimiter()
        self._initialized = False

    async def initialize(self) -> None:
        """Initialize game engine resources."""
        if self._initialized:
            return
        
        logger.info(f"Initializing game engine: {self.game_id}")
        
        # Initialize GitHub client
        if not self.github_client.token:
            logger.warning(
                "GitHub token not configured. API calls may fail with 403 Forbidden.",
                extra={"game_id": self.game_id}
            )
        
        self._initialized = True

    async def cleanup(self) -> None:
        """Clean up game engine resources."""
        await self.github_client.close()
        self._initialized = False