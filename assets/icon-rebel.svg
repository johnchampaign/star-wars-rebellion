<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rebelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a9d8f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rebelGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3bb892;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e7a6e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#rebelGrad)" stroke-width="3" opacity="0.3"/>

  <!-- Inner ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#rebelGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="38" fill="#0a0a1a" stroke="url(#rebelGrad)" stroke-width="2"/>

  <!-- Rebel starbird / phoenix symbol -->
  <g filter="url(#glow)">
    <!-- Main body - stylized phoenix/starbird -->
    <path d="
      M 50 18
      L 58 38
      L 80 38
      L 63 52
      L 70 74
      L 50 60
      L 30 74
      L 37 52
      L 20 38
      L 42 38
      Z
    " fill="url(#rebelGrad)" stroke="#4ecca3" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Center star -->
    <circle cx="50" cy="48" r="5" fill="#0a0a1a" stroke="#4ecca3" stroke-width="1.2"/>
    <circle cx="50" cy="48" r="3" fill="#4ecca3" opacity="0.8"/>

    <!-- Wing detail lines -->
    <line x1="50" y1="28" x2="50" y2="38" stroke="#4ecca3" stroke-width="0.8" opacity="0.6"/>
    <line x1="42" y1="38" x2="35" y2="50" stroke="#4ecca3" stroke-width="0.8" opacity="0.4"/>
    <line x1="58" y1="38" x2="65" y2="50" stroke="#4ecca3" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Small decorative dots at cardinal points -->
  <circle cx="50" cy="12" r="2" fill="#4ecca3" opacity="0.6"/>
  <circle cx="50" cy="88" r="2" fill="#4ecca3" opacity="0.6"/>
  <circle cx="12" cy="50" r="2" fill="#4ecca3" opacity="0.6"/>
  <circle cx="88" cy="50" r="2" fill="#4ecca3" opacity="0.6"/>

  <!-- Subtle outer glow ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#4ecca3" stroke-width="0.5" opacity="0.15"/>
</svg>