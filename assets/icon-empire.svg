# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

class GamePhase(Enum):
    """Represents the current phase of a game turn."""
    COMMAND = auto()
    ACTION = auto()
    REFRESH = auto()
    END = auto()

class Loyalty(Enum):
    """Faction loyalty for a system."""
    EMPIRE = "empire"
    REBEL = "rebel"
    NEUTRAL = "neutral"

class MissionType(Enum):
    """Types of missions available in the game."""
    INFILTRATION = "infiltration"
    SUPPORT = "support-of-mon-calamari"
    LOCAL_RUMORS = "local-rumors"
    SABOTAGE = "sabotage"
    RECRUITMENT = "recruitment"

class LogLevel(Enum):
    """Logging severity levels."""
    DEBUG = logging.DEBUG
    INFO = logging.INFO
    WARNING = logging.WARNING
    ERROR = logging.ERROR
    CRITICAL = logging.CRITICAL

class MissionResult(Enum):
    """Possible outcomes of a mission."""
    SUCCESS = auto()
    FAILURE = auto()
    AUTO_SUCCESS = auto()
    OPPOSED = auto()
    CANCELLED = auto()

# ---------------------------------------------------------------------------
# Custom Exceptions
# ---------------------------------------------------------------------------

class GameEngineError(Exception):
    """Base exception for game engine errors."""
    pass

class InvalidMoveError(GameEngineError):
    """Raised when an invalid move is attempted."""
    pass

class InvalidMissionError(GameEngineError):
    """Raised when a mission cannot be executed."""
    pass

class ResourceNotFoundError(GameEngineError):
    """Raised when a requested resource does not exist."""
    pass

class StateEncodingError(GameEngineError):
    """Raised when state encoding/decoding fails."""
    pass

class ConcurrencyError(GameEngineError):
    """Raised when concurrent access conflicts occur."""
    pass

class ValidationError(GameEngineError):
    """Raised when input validation fails."""
    pass

class SecurityError(GameEngineError):
    """Raised when security checks fail."""
    pass

class GitHubAPIError(GameEngineError):
    """Raised when GitHub API operations fail."""
    pass

