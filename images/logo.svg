<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="empireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rebelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eaeaea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="8" ry="8" fill="#0a0a1a" stroke="#0f3460" stroke-width="1.5"/>

  <!-- Rebel Alliance Starbird (left) -->
  <g transform="translate(45, 60)" filter="url(#shadow)">
    <!-- Starbird body -->
    <path d="M0,-28 C-8,-22 -18,-12 -22,-4 C-26,4 -24,10 -20,14 C-16,18 -10,20 -4,18 C0,16 2,12 0,8 C-2,4 -6,2 -8,4 C-10,6 -8,10 -6,12 C-4,14 -2,14 0,12 C2,10 4,6 4,2 C4,-2 2,-8 0,-14 C-2,-20 -4,-24 -6,-26 L0,-28 Z" fill="url(#rebelGrad)" stroke="#eaeaea" stroke-width="1.2"/>
    <!-- Starbird wings -->
    <path d="M-22,-4 C-28,-8 -34,-10 -38,-8 C-42,-6 -42,-2 -38,2 C-34,6 -28,8 -22,6 C-18,4 -16,0 -18,-4 C-20,-6 -22,-6 -22,-4 Z" fill="url(#rebelGrad)" stroke="#eaeaea" stroke-width="0.8"/>
    <path d="M22,-4 C28,-8 34,-10 38,-8 C42,-6 42,-2 38,2 C34,6 28,8 22,6 C18,4 16,0 18,-4 C20,-6 22,-6 22,-4 Z" fill="url(#rebelGrad)" stroke="#eaeaea" stroke-width="0.8"/>
    <!-- Starbird tail -->
    <path d="M-4,18 C-8,24 -12,28 -16,30 C-12,28 -8,24 -4,20 C0,16 2,14 0,12" fill="none" stroke="#eaeaea" stroke-width="1.2"/>
    <path d="M4,18 C8,24 12,28 16,30 C12,28 8,24 4,20 C0,16 -2,14 0,12" fill="none" stroke="#eaeaea" stroke-width="1.2"/>
  </g>

  <!-- VS Divider -->
  <g transform="translate(120, 60)">
    <text x="0" y="6" font-family="'Orbitron', sans-serif" font-size="18" font-weight="900" fill="#0f3460" text-anchor="middle" filter="url(#glow)">VS</text>
  </g>

  <!-- Imperial Cog (right) -->
  <g transform="translate(195, 60)" filter="url(#shadow)">
    <!-- Outer cog -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#empireGrad)" stroke-width="3"/>
    <!-- Cog teeth -->
    <g stroke="url(#empireGrad)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-34"/>
      <line x1="20" y1="-20" x2="24" y2="-24"/>
      <line x1="28" y1="0" x2="34" y2="0"/>
      <line x1="20" y1="20" x2="24" y2="24"/>
      <line x1="0" y1="28" x2="0" y2="34"/>
      <line x1="-20" y1="20" x2="-24" y2="24"/>
      <line x1="-28" y1="0" x2="-34" y2="0"/>
      <line x1="-20" y1="-20" x2="-24" y2="-24"/>
    </g>
    <!-- Inner gear -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e94560" stroke-width="1.5" opacity="0.6"/>
    <!-- Spokes -->
    <g stroke="#e94560" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-18" y1="0" x2="18" y2="0"/>
      <line x1="-13" y1="-13" x2="13" y2="13"/>
      <line x1="-13" y1="13" x2="13" y2="-13"/>
    </g>
    <!-- Center hub -->
    <circle cx="0" cy="0" r="6" fill="#e94560" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#0a0a1a"/>
  </g>

  <!-- AI Empire Text -->
  <g transform="translate(310, 60)">
    <text x="0" y="-12" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="url(#aiGrad)" text-anchor="middle" letter-spacing="3" filter="url(#glow)">AI</text>
    <text x="0" y="8" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" fill="#eaeaea" text-anchor="middle" letter-spacing="4">EMPIRE</text>
    <!-- Underline accent -->
    <line x1="-30" y1="14" x2="30" y2="14" stroke="url(#aiGrad)" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Decorative corner accents -->
  <g stroke="#0f3460" stroke-width="1" opacity="0.4">
    <line x1="8" y1="8" x2="20" y2="8"/>
    <line x1="8" y1="8" x2="8" y2="20"/>
    <line x1="392" y1="8" x2="380" y2="8"/>
    <line x1="392" y1="8" x2="392" y2="20"/>
    <line x1="8" y1="112" x2="20" y2="112"/>
    <line x1="8" y1="112" x2="8" y2="100"/>
    <line x1="392" y1="112" x2="380" y2="112"/>
    <line x1="392" y1="112" x2="392" y2="100"/>
  </g>
</svg>