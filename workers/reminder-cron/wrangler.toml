# Stale-turn-reminder cron Worker. Holds NO secrets — it just pings the Pages
# endpoint /api/cron/sweep-reminders on a schedule, and that endpoint runs the
# sweep with the SUPABASE_* / RESEND_* secrets the Pages project already has.
#
# Deploy: npx wrangler deploy --config workers/reminder-cron/wrangler.toml
name = "swr-reminder-cron"
main = "index.ts"
compatibility_date = "2024-09-23"

# Hourly. The reminder fires once a turn has been idle past the endpoint's
# threshold (24h); the hourly cadence just bounds how late the nudge can be.
[triggers]
crons = ["0 * * * *"]

[vars]
# The Pages endpoint to ping. Production:
SWEEP_URL = "https://star-wars-rebellion.pages.dev/api/cron/sweep-reminders"
# CRON_KEY is only needed if you set CRON_SECRET on the Pages project to lock
# the endpoint down (then set the matching value here). Open by default.
